<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Deliberately one ring and one arm: at 16px anything more turns to
       mush. The arm pointing at the blip is what keeps this reading as a
       radar rather than a generic target. -->
  <g stroke="#fff" stroke-width="7.4" fill="none" stroke-linecap="round">
    <circle cx="50" cy="50" r="30"/>
    <line x1="50" y1="50" x2="74" y2="26"/>
  </g>
  <circle cx="74" cy="26" r="10" fill="#fff"/>
</svg>
