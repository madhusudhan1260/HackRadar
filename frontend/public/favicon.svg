<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5850ec"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Light along the top edge: reads as a physical object, not a sticker. -->
    <radialGradient id="gloss" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="23" fill="url(#plate)"/>
  <rect width="100" height="100" rx="23" fill="url(#gloss)"/>

  <!--
    Built from filled area rather than thin strokes. Hairlines vanish when
    a browser downsamples to 16px; a solid wedge keeps its silhouette.
  -->
  <g fill="none" stroke="#fff" stroke-width="8">
    <circle cx="50" cy="50" r="31"/>
  </g>
  <path d="M50 50 L50 19 A31 31 0 0 1 76.8 34.5 Z" fill="#fff"/>
  <circle cx="50" cy="50" r="5.5" fill="#fff"/>
</svg>
