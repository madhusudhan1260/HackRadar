# Render Blueprint — creates the API and its Postgres database in one go.
#
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Everything below is provisioned automatically except SUPPORT_EMAIL and
# CORS_ORIGINS, which you set once the frontend has a URL.

databases:
  - name: hackradar-db
    databaseName: hackradar
    user: hackradar
    plan: free

services:
  - type: web
    name: hackradar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is supplied by Render; binding anywhere else fails the health check.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackradar-db
          property: connectionString

      # Generated once by Render and then held constant. Rotating it
      # invalidates every session.
      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12"

      - key: ENABLED_COLLECTORS
        value: devpost,mlh

      - key: INGEST_INTERVAL_MINUTES
        value: "360"

      - key: RUN_SCHEDULER
        value: "true"

      - key: SUPPORT_EMAIL
        value: madhuusudhann01@gmail.com

      # The static site below is served from a different origin, so the
      # API has to allow it explicitly. Add any custom domain here too.
      - key: CORS_ORIGINS
        value: https://hackradar-web.onrender.com

  # ------------------------------------------------------------------
  # Frontend. A static site: Render runs the Vite build and serves dist/
  # from its CDN, so it stays fast even while the API instance is asleep.
  # ------------------------------------------------------------------
  - type: web
    name: hackradar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Absolute API origin — the two services are on different hosts.
      - key: VITE_API_BASE
        value: https://hackradar-api.onrender.com
      # Baked into the social preview tags at build time.
      - key: VITE_SITE_URL
        value: https://hackradar-web.onrender.com
    routes:
      # Single-page app: unknown paths are routes, not missing files, so
      # hand them to index.html and let the router decide.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
